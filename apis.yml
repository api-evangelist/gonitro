aid: gonitro
name: GoNitro
description: >-
  Nitro Software (GoNitro) is a document productivity company providing PDF
  editing, electronic signatures, redaction, and intelligent document
  automation for enterprises, small businesses, and professionals. Nitro
  exposes two public REST APIs on api.gonitro.dev: the Nitro PDF Services API
  (convert, transform, extract, and generate PDFs — conversions, compression,
  merge/split, OCR, redaction, PII detection, table and form extraction, and
  archival PDF/A) and the Nitro Sign API (enterprise eSignature envelope,
  document, participant, and field workflows with sealed documents and audit
  trails). Both use machine-to-machine OAuth 2.0 client-credentials, short-lived
  JWT bearer tokens, RFC 9457 problem+json errors, and asynchronous job
  processing. Nitro is ISO 27001, SOC 2, and HIPAA compliant and an accredited
  eIDAS Qualified Trust Service Provider.
