openapi: 3.2.0
info:
  title: Nitro Sign Public Platform API
  description: REST API for Nitro Sign
  version: '0.1'
servers:
- url: https://api.gonitro.dev
  description: Europe
- url: https://api.us.gonitro.dev
  description: North America
- url: https://api.au.gonitro.dev
  description: Australia
security:
- bearerAuth: []
tags:
- name: Platform
paths:
  /transformations:
    post:
      tags:
      - Platform
      summary: Request a transformation operation
      operationId: forwardTransformationsRequest
      responses:
        '200':
          description: OK
  /presigned-file-urls:
    post:
      tags:
      - Platform
      summary: Request presigned upload and download URL pairs for direct file transfer
      operationId: requestPresignedFileUrls
      responses:
        '200':
          description: OK
  /generations:
    post:
      tags:
      - Platform
      summary: Request a generation operation
      operationId: forwardGenerationsRequest
      responses:
        '200':
          description: OK
  /extractions:
    post:
      tags:
      - Platform
      summary: Request an extraction operation
      operationId: forwardExtractionsRequest
      responses:
        '200':
          description: OK
  /conversions:
    post:
      tags:
      - Platform
      summary: Request a conversion operation
      operationId: forwardConversionsRequest
      responses:
        '200':
          description: OK
  /jobs/{jobID}:
    get:
      tags:
      - Platform
      summary: Get the result of a job by its job id
      operationId: getJobResult
      responses:
        '200':
          description: OK
  /jobs/{jobID}/status:
    get:
      tags:
      - Platform
      summary: Get the status of a job by its job id
      operationId: getJobStatus
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
